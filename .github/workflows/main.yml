name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo killall apt apt-get 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
          sudo apt-get update -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --fix-missing \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf \
            automake libtool pkg-config cmake ninja-build unzip zip

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython setuptools
          pip install git+https://github.com/kivy/buildozer.git

      - name: Configure buildozer.spec and Build APK
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

          sed -i 's/^title =.*/title = Yemek Menusu/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = yemekmenusu/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3==3.10.12,kivy/' buildozer.spec
          sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/^#\? \?android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^#\? \?android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^#\? \?android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec

          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yemek-Menusu-APK
          path: bin/*.apk
