name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" "buildozer==1.5.0"

    - name: Generate buildozer.spec if missing
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
          sed -i 's/^title =.*/title = Yemek Menusu/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = yemekmenusu/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/^#\? \?android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^#\? \?android.archs =.*/android.archs = arm64-v8a/' buildozer.spec
        fi

    - name: Accept Android SDK Licenses & Build APK
      run: |
        export CFLAGS="-Wno-error=incompatible-pointer-types -Wno-implicit-function-declaration"
        yes | buildozer -v android debug --accept-licenses
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YemekMenusu-APK
        path: bin/*.apk
