- name: Install System Dependencies
        run: |
          # Apt kilitlerini ve çakışan süreçleri temizle
          sudo killall apt apt-get 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
          
          # Depoları yeniden senkronize et
          sudo apt-get update -y
          
          # Paketleri non-interactive (sorusuz) modda ve hata toleransıyla kur
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --fix-missing \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixin-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            unzip \
            zip
